# The iOS game-code build from this desktop (runtime/gamebuild.c GAMEBUILD_IOS): the player's zig compiles a
# fixture for arm64 iOS, the iOS kit's lld links it (both fetched as the release does, archives cached). The
# same step on every desktop job of ci.yml.
name: iOS game-code build test
description: fetch zig and lld as the app does, build the fixture with them (tools/test_gamebuild_ios.py)
inputs:
  shell:
    description: the job's shell (the Windows jobs build in MSYS2's)
    default: bash
runs:
  using: composite
  steps:
    - name: iOS toolchain cache
      uses: actions/cache@v4
      with:
        path: |
          build/zig-dl
          build/lld-dl
        key: ios-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_zig.sh', 'tools/fetch_lld.sh') }}
    - name: iOS game-code build (zig + lld, a fixture)
      shell: ${{ inputs.shell }}
      run: |
        tools/fetch_zig.sh
        tools/fetch_lld.sh
        python3 tools/test_gamebuild_ios.py
