# LAS Recomp's release builds: the macOS arm64 .dmg (make dmg), the Windows x64 .zip (make dist), the Linux
# x86_64 / aarch64 AppImages (make appimage) and the same files as .tar.gz (make tarball), the signed Android .apk (from Beta 6) and the iOS kit .laskit (make ios-kit: the iOS app without game code
# plus the tools any of those desktops completes it with), each from the same commit, put on a DRAFT
# GitHub release with their sha256s. It never publishes: a person reads the draft, writes the notes and publishes
# it. None of the files holds game code or game files (the start screen builds the game code from the player's own
# game files); every build checks that before its upload.
# Run: gh workflow run release.yml --ref beta_5 -f tag=beta_5 -f ref=beta_5
#   (--ref: the branch whose copy of this file runs - GitHub dispatches by name only from the default branch's copy,
#   so until this file is on main, name a branch that has it)
#   tag: the release tag; must equal LARECOMP_VERSION (runtime/ui/launcher.mm) at ref - the file names come from it.
#   ref: branch or commit to build (default: the dispatching branch's head).
#   platforms: test builds (test-*, ci-test-*) only - the platforms the fix targets and wants feedback from, e.g.
#     -f platforms=windows or -f platforms=macos,linux: every platform is still built (a compile check), only those
#     files go on the test build. Releases always ship every platform.
#     windows-arm64 (Windows on ARM) is for test builds only and only built when named: it isn't a release platform
#     (it ships on the nightly page, nightly.yml), e.g. -f platforms=windows-arm64,linux-aarch64.
# Dry run of this workflow itself: a tag starting with ci-test- may differ from LARECOMP_VERSION (the files keep its
# name); its draft is a prerelease, as for test-<name> builds.
# Also on a release published on GitHub (its tag = LARECOMP_VERSION at the tagged commit): the files are built and
# attached to it, with a "being built" line on top of its notes meanwhile and the sha256 table under them after. A
# release that already has files (a draft this workflow made, then published) is left alone.
# Linux aarch64 lives on the nightly page (nightly.yml). A release's linux-aarch64 file is not built here: it is the
# newest Linux arm64 nightly, copied under the release's file name, so players on older release builds that still look
# for it (Beta 5.3 / 5.4) move onto the nightlies (that build only offers newer nightlies). A test build builds it.
# Until 1.0.0.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (= LARECOMP_VERSION at ref; ci-test-*: dry run)'
        required: true
      ref:
        description: 'Branch or commit to build (default: the dispatching ref)'
        required: false
        default: ''
      platforms:
        description: 'Test builds only: the platforms the fix targets (macos, windows, linux, linux-aarch64, android, ios, windows-arm64; comma list). Empty: all but windows-arm64'
        required: false
        default: ''
permissions:
  contents: read
concurrency:  # (one run per tag at a time; a second waits instead of racing the first's draft)
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
      platforms: ${{ steps.v.outputs.platforms }}
      arm64: ${{ steps.v.outputs.arm64 }}
      linux: ${{ steps.v.outputs.linux }}
      nightly_arm: ${{ steps.v.outputs.nightly_arm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # (the inputs go through env, never into the script text)
      - name: Tag = LARECOMP_VERSION
        id: v
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PLATFORMS: ${{ inputs.platforms }}
          ASSETS: ${{ github.event_name == 'release' && toJSON(github.event.release.assets) || '[]' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # (a published release that already has its files: made by a dispatched run - nothing to do)
          if [ "$(jq length <<< "$ASSETS")" != 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$TAG already has files"; exit 0; fi
          # (the old rolling experimental release and test-arm-* test builds, from the retired experimental.yml)
          if [[ $TAG == experimental* || $TAG == test-arm-* ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$TAG: not a release.yml build"; exit 0; fi
          [[ $TAG =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::tag '$TAG': letters, digits, . _ - only"; exit 1; }
          SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/^#define LARECOMP_VERSION "\(.*\)"/\1/p' runtime/ui/launcher.mm)
          if [ "$VERSION" != "$TAG" ]; then
            if [[ $TAG == ci-test-* ]]; then
              echo "::warning::dry run: tag $TAG, LARECOMP_VERSION $VERSION (the files are named after $VERSION)"
            else
              echo "::error::LARECOMP_VERSION at $SHA is '$VERSION', not '$TAG': set it in runtime/ui/launcher.mm first"
              exit 1
            fi
          fi
          # an existing tag must already point at this commit (a draft's tag is only made when it is published)
          if TAGGED=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" -q .sha 2>/dev/null); then
            [ "$TAGGED" = "$SHA" ] || { echo "::error::tag $TAG exists at $TAGGED, not at $SHA"; exit 1; }
          fi
          # the platforms whose files ship: all for a release; a test build may name only the ones its fix targets
          PLATFORMS=${PLATFORMS//,/ }
          if [ -z "${PLATFORMS// /}" ]; then PLATFORMS="macos windows linux linux-aarch64 android ios"
          elif [[ $TAG != test-* && $TAG != ci-test-* ]]; then echo "::error::platforms: only for test builds; a release ships all"; exit 1; fi
          for p in $PLATFORMS; do
            case $p in macos|windows|linux|linux-aarch64|android|ios|windows-arm64) ;;
                       *) echo "::error::platform '$p': macos, windows, linux, linux-aarch64, android, ios or windows-arm64"; exit 1 ;; esac
          done
          # (Windows on ARM: built only for a test build that names it)
          if [[ " $PLATFORMS " == *" windows-arm64 "* ]]; then echo "arm64=true" >> "$GITHUB_OUTPUT"; fi
          # (Linux aarch64: a test build builds it; a release, or a ci-test- dry run of one, copies the newest nightly)
          if [[ $TAG == test-* ]]; then
            echo 'linux=[{"arch":"x86_64","runner":"ubuntu-24.04"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'linux=[{"arch":"x86_64","runner":"ubuntu-24.04"}]' >> "$GITHUB_OUTPUT"
            echo "nightly_arm=true" >> "$GITHUB_OUTPUT"
          fi
          echo "platforms=$(echo $PLATFORMS)" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "platforms: $PLATFORMS"
          echo "$TAG: $SHA, LARECOMP_VERSION $VERSION"

  macos:
    needs: check
    if: needs.check.outputs.skip != 'true'
    # (a fresh Tart VM per job on the maintainer's Mac, deleted after; macOS 15. Forks have none: GitHub's macOS 15)
    runs-on: ${{ github.repository == 'peiikai/LASRecomp' && fromJSON('["self-hosted", "macos-vm"]') || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Packages
        run: brew install ninja  # (cmake is on the runner; the rest comes from make deps)
      # make deps skips each part whose output exists; src/ (sources, build trees) isn't needed for that
      # (restore / save as two steps: saved as soon as it's built, even when a later step fails)
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps
            !build/deps/src
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_deps_macos.sh') }}
      - name: Deps (SDL3, LGPL FFmpeg, keystone, Python)
        run: make deps
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps
            !build/deps/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      # (keystone-engine has no macOS arm64 wheel: pip builds it, then keeps it in its cache)
      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/LAS-Randomizer/requirements.txt', 'Makefile') }}
      - name: Generator helpers
        run: make rando-helper && make gen-helper
      - name: Compiler for the player's machine
        run: tools/fetch_zig.sh
      - name: App and disk image
        run: make -j"$(sysctl -n hw.ncpu)" dmg
      # bundle_macos.sh checked the executable; here everything inside the app: no game code in any Mach-O, no
      # game files, no generated C (gamelib-src/: the headers and the entry stub it's compiled with; zig/lib: zig's own
      # runtime sources)
      - name: No game code
        run: |
          A="build/LAS Recomp.app"
          bad=$(find "$A" -type d \( -name extracted -o -name 'generated*' -o -name exefs -o -name romfs \);
                find "$A" -name '*.c' ! -path '*/zig/lib/*' ! -path '*/gamelib-src/gamelib_entry.c'; find "$A" -name 'lasgame*')
          [ -z "$bad" ] || { echo "::error::must not ship: $bad"; exit 1; }
          find "$A" -type f \( -perm +111 -o -name '*.dylib' -o -name '*.so' \) | while read -r f; do
            if nm "$f" 2>/dev/null | grep ' _\{0,1\}f_70' >/dev/null; then echo "::error::game code in $f"; exit 1; fi
          done
          ls -la build/dist
      # Sparkle's feed for the macOS app (tools/sparkle_appcast.sh; none without the key)
      - name: Sparkle feed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: tools/sparkle_appcast.sh "$TAG" build/dist/*-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/dist/*.dmg
            build/dist/appcast-*.xml
          if-no-files-found: error
          compression-level: 0  # (already compressed)

  windows:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings, as tools/setup_windows.ps1 sets for clones
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      # the generator helpers are frozen from a python.org-style CPython 3.12 (MSYS2's Python has no oead wheel)
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
      # MSYS2 UCRT64 as tools/setup_windows.ps1 sets it up (minus the debugger / validation layers; no FFmpeg:
      # the release links make deps-windows' LGPL one), nasm for FFmpeg's VP9 assembly, zip / unzip for the
      # release zip and the compiler download
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git curl tar xz diffutils zip unzip
          pacboy: clang:p lld:p binutils:p sdl3:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p nasm:p
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: deps-${{ runner.os }}-${{ hashFiles('tools/build_deps_windows.sh') }}
      - name: Deps (LGPL FFmpeg)
        run: make deps-windows
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Generator helpers
        run: |
          PY=$(cygpath -u '${{ steps.py.outputs.python-path }}')
          make rando-helper RANDO_PY="$PY" && make gen-helper RANDO_PY="$PY"
      - name: Compiler for the player's machine
        run: tools/fetch_zig.sh
      # (make dist: the exe holds no game code, no GPL codec libraries)
      # (the zip says x64, as launchers pick a file by system and processor; the self-updater takes the name from its
      #  manifest, update-windows.txt, which keeps its name)
      - name: Release zip
        run: make -j"$(nproc)" dist
      - name: No game files or generated C
        run: |
          D="build/dist/LAS Recomp"
          bad=$(find "$D" -type d \( -name extracted -o -name 'generated*' -o -name exefs -o -name romfs \);
                find "$D" -name '*.c' ! -path '*/zig/lib/*' ! -path '*/gamelib-src/gamelib_entry.c'; find "$D" -name 'lasgame*')
          [ -z "$bad" ] || { echo "::error::must not ship: $bad"; exit 1; }
          ls -la build/dist
      # the self-updater's signed manifest (tools/update_manifest.sh; none without the key: Download only)
      - name: Update manifest
        env: { UPDATE_SIGNING_KEY: '${{ secrets.UPDATE_SIGNING_KEY }}', VERSION: '${{ needs.check.outputs.version }}' }
        run: tools/update_manifest.sh "$VERSION" windows build/dist/*-windows-x64.zip "build/dist/LAS Recomp"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/dist/*.zip
            build/dist/update-*.txt
          if-no-files-found: error
          compression-level: 0

  # Windows on ARM (MSYS2 CLANGARM64): only for a test build that names windows-arm64 (it ships on the nightly page)
  windows-arm64:
    needs: check
    if: needs.check.outputs.skip != 'true' && needs.check.outputs.arm64 == 'true'
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings, as tools/setup_windows.ps1 sets for clones
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      # the generator helpers are frozen from a python.org-style CPython 3.12 (MSYS2's Python has no oead wheel)
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
          architecture: x64  # (as nightly.yml: the x64 Python, emulated, for the generator helpers)
      # MSYS2 CLANGARM64, as nightly.yml's Windows on ARM build
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: make git curl tar xz diffutils zip unzip
          pacboy: clang:p lld:p sdl3:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p vulkan-memory-allocator:p
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: deps-windows-arm64-${{ hashFiles('tools/build_deps_windows.sh') }}
      - name: Deps (LGPL FFmpeg)
        run: make deps-windows
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-win
            !build/deps-win/src
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Generator helpers
        run: |
          PY=$(cygpath -u '${{ steps.py.outputs.python-path }}')
          make rando-helper RANDO_PY="$PY" && make gen-helper RANDO_PY="$PY"
      - name: Compiler for the player's machine
        run: tools/fetch_zig.sh
      # (make dist: the exe holds no game code, no GPL codec libraries)
      - name: Release zip
        run: make -j"$(nproc)" dist
      - name: No game files or generated C
        run: |
          D="build/dist/LAS Recomp"
          bad=$(find "$D" -type d \( -name extracted -o -name 'generated*' -o -name exefs -o -name romfs \);
                find "$D" -name '*.c' ! -path '*/zig/lib/*' ! -path '*/gamelib-src/gamelib_entry.c'; find "$D" -name 'lasgame*')
          [ -z "$bad" ] || { echo "::error::must not ship: $bad"; exit 1; }
          ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: build/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  # The iOS kit (tools/ios_kit.sh, one .laskit file): the app without game code (make ios-skeleton: Xcode's iOS SDK,
  # so a Mac), the Mach-O linker for each desktop (tools/fetch_lld.sh, all five targets) and the compiler's Darwin
  # headers (from the zig archive tools/fetch_zig.sh fetched: the same files for every host). The start screen on
  # any desktop reads it as it is and writes the player's .ipa (runtime/iosexport.c).
  ios:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ${{ github.repository == 'peiikai/LASRecomp' && fromJSON('["self-hosted", "macos-vm"]') || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Packages
        run: brew install ninja python@3.13
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-ios
            !build/deps-ios/pyvenv
          key: deps-ios-${{ hashFiles('tools/build_deps_ios.sh', 'tools/patches/keystone-0.9.2.patch', 'tools/patches/SDL3-3.4.18-ios27-orientation.patch', 'third_party/LAS-Randomizer/requirements.txt') }}  # (as ci.yml's)
      - name: Deps (SDL3, FFmpeg, keystone, CPython, the generator's packages)
        run: make deps-ios
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/deps-ios
            !build/deps-ios/pyvenv
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Toolchain cache (the zig archive, the five lld archives)
        uses: actions/cache@v4
        with:
          path: |
            build/zig-dl
            build/lld-dl
          key: ios-kit-tools-${{ hashFiles('tools/fetch_zig.sh', 'tools/fetch_lld.sh') }}
      - name: Linkers for every desktop, the compiler's headers
        run: |
          tools/fetch_zig.sh
          for t in aarch64-macos x86_64-linux aarch64-linux x86_64-windows aarch64-windows; do LLD_TARGET=$t tools/fetch_lld.sh; done
      - name: Kit
        run: make -j"$(sysctl -n hw.ncpu)" ios-kit
      # bundle_ios.sh checked the executable; here the whole app: no game code in any Mach-O (f_70...: the game's own
      # addresses, under --dyn-base too), no game files; and the kit as the runtime reads it: the app under Payload/,
      # no symlink entries in it (an iOS install drops them; zipinfo's 'l'), every host's linker in it
      - name: No game code; the kit's layout
        run: |
          A="build/ios-skeleton/LAS Recomp.app"
          bad=$(find "$A" -type d \( -name extracted -o -name 'generated*' -o -name exefs -o -name romfs \); find "$A" -name 'lasgame*' -o -name 'LASGame' -type f)
          [ -z "$bad" ] || { echo "::error::must not ship: $bad"; exit 1; }
          find "$A" -type f \( -perm +111 -o -name '*.dylib' -o -name '*.so' \) | while read -r f; do
            if nm "$f" 2>/dev/null | grep -E ' _?f_[78]0' >/dev/null; then echo "::error::game code in $f"; exit 1; fi
          done
          K=$(ls build/dist/*-iOS.laskit)
          zipinfo -1 "$K" | grep -q '^Payload/LAS Recomp.app/Info.plist$' || { echo "::error::no Payload/LAS Recomp.app in the kit"; exit 1; }
          links=$(zipinfo "$K" | grep '^l.* Payload/' || true); [ -z "$links" ] || { echo "::error::symlink entries in the kit's app: $links"; exit 1; }
          zipinfo -1 "$K" | grep -q '^Payload/LAS Recomp.app/Frameworks/keystone.libkeystone.framework/keystone.libkeystone$' || { echo "::error::keystone's framework missing from the kit"; exit 1; }
          for t in aarch64-macos x86_64-linux aarch64-linux x86_64-windows aarch64-windows; do
            zipinfo -1 "$K" | grep -q "^lld/$t/bin/lld" || { echo "::error::no linker for $t in the kit"; exit 1; }
          done
          zipinfo -1 "$K" | grep -q '^include/any-darwin-any/stdlib.h$' && zipinfo -1 "$K" | grep -q '^libSystem.B.tbd$' || { echo "::error::headers / link stub missing"; exit 1; }
          zipinfo -1 "$K" | grep -q '^version.txt$' || { echo "::error::no version.txt in the kit"; exit 1; }
          # (the executable as the kit holds it: a sideloader keeps its entitlements, without them the guest window doesn't fit)
          X=$(mktemp -d); unzip -q "$K" 'Payload/LAS Recomp.app/lasrecomp' -d "$X"
          codesign -d --entitlements :- "$X/Payload/LAS Recomp.app/lasrecomp" 2>/dev/null | grep -q increased-memory-limit || { echo "::error::the kit's executable is signed without increased-memory-limit"; exit 1; }
          ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: iOS
          path: build/dist/*-iOS.laskit
          if-no-files-found: error
          compression-level: 0

  # Each arch on a runner of its own arch: tools/linux/appimage.sh then builds everything natively in one container
  # (its cross path - the amd64 container plus the arm64 one under QEMU for the generator helpers - stays for an
  # x86-64 machine building the aarch64 AppImage).
  linux:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # (aarch64 only for a test build: check's linux output)
        include: ${{ fromJSON(needs.check.outputs.linux || '[{"arch":"x86_64","runner":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      # build_deps.sh skips each part whose output exists (deps-build/: the build trees, not needed for that)
      - name: Deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/linux/${{ matrix.arch }}/deps
          key: deps-linux-${{ matrix.arch }}-${{ hashFiles('tools/linux/build_deps.sh', 'tools/linux/Containerfile') }}
      # the helpers' wheels (arm64: oead and keystone-engine built from source, no wheels on PyPI)
      - name: Wheels cache
        id: wheels
        uses: actions/cache/restore@v4
        with:
          path: build/linux/${{ matrix.arch }}/wheels
          key: wheels-linux-${{ matrix.arch }}-${{ hashFiles('third_party/LAS-Randomizer/requirements.txt', 'tools/linux/rando_helper.sh', 'tools/linux/Containerfile') }}
      - name: AppImage
        run: make appimage ARCH=${{ matrix.arch }}
      # saved once complete (shaderc: build_deps.sh's last part; .ok: the helpers' wheels all installed), even when a
      # later part of the build fails
      - uses: actions/cache/save@v4
        if: always() && steps.deps.outputs.cache-hit != 'true' && hashFiles(format('build/linux/{0}/deps/lib/libshaderc_shared.so*', matrix.arch)) != ''
        with:
          path: build/linux/${{ matrix.arch }}/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.wheels.outputs.cache-hit != 'true' && hashFiles(format('build/linux/{0}/rando-venv/.ok', matrix.arch)) != ''
        with:
          path: build/linux/${{ matrix.arch }}/wheels
          key: ${{ steps.wheels.outputs.cache-primary-key }}
      # package.sh checked the executable; here the whole AppDir that was packed (readelf: any arch's ELF), then the
      # tarball made from it (the same files in one folder, for places without FUSE: tools/linux/tarball.sh)
      - name: No game code
        run: tools/linux/check_no_game_code.sh build/linux/${{ matrix.arch }}/AppDir
      - name: Tarball
        run: |
          make tarball ARCH=${{ matrix.arch }}
          ls -la build/dist
      - name: Data folder rules
        run: tools/linux/check_portable.sh ${{ matrix.arch }}
      - name: Update manifest
        env: { UPDATE_SIGNING_KEY: '${{ secrets.UPDATE_SIGNING_KEY }}', VERSION: '${{ needs.check.outputs.version }}' }
        run: tools/update_manifest.sh "$VERSION" linux-${{ matrix.arch }} build/dist/*-linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/dist/*.AppImage
            build/dist/*.tar.gz
            build/dist/update-*.txt
          if-no-files-found: error
          compression-level: 0

  # A release's linux-aarch64 file: the newest Linux arm64 nightly (nightly.yml's rolling "nightly" pre-release) as it
  # is, under this release's file name. Older release builds (Beta 5.3 / 5.4) find it by that name; being a nightly
  # build, it then only offers newer nightlies (LARECOMP_NIGHTLY_STAMP, runtime/ui/launcher.mm).
  linux-aarch64-nightly:
    needs: check
    if: needs.check.outputs.skip != 'true' && needs.check.outputs.nightly_arm == 'true'
    runs-on: ubuntu-24.04-arm
    outputs:
      name: ${{ steps.n.outputs.name }}
    steps:
      - uses: actions/checkout@v4  # (tools/linux/check_no_game_code.sh)
        with:
          ref: ${{ needs.check.outputs.sha }}
          sparse-checkout: tools
      - name: Newest nightly AppImage
        id: n
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # (the newest stamp: during a round nightly_publish.sh uploads the new file before it deletes the old one)
          NAME=$(gh release view nightly --json assets -q '.assets[].name' |
                 grep -E '^LAS\.Recomp-nightly-[0-9]{12}-[0-9a-f]{7}-linux-aarch64\.AppImage$' | sort | tail -1 || true)
          [ -n "$NAME" ] || { echo "::error::no linux-aarch64 AppImage on the nightly release"; exit 1; }
          STAMP=$(cut -d- -f3 <<< "$NAME"); COMMIT=$(cut -d- -f4 <<< "$NAME")
          mkdir -p dl build/dist
          gh release download nightly -p "$NAME" -D dl
          DIGEST=$(gh api "repos/$GH_REPO/releases/tags/nightly" -q ".assets[] | select(.name == \"$NAME\") | .digest // empty")
          [ -z "$DIGEST" ] || [ "$DIGEST" = "sha256:$(sha256sum "dl/$NAME" | cut -d' ' -f1)" ] || { echo "::error::$NAME: not the sha256 GitHub has"; exit 1; }
          chmod +x "dl/$NAME" && (cd dl && "./$NAME" --appimage-extract > /dev/null)
          # it is that nightly build (nightly_version.sh: version nightly-<stamp>-<commit>, LARECOMP_NIGHTLY_STAMP <stamp>)
          grep -aq "nightly-$STAMP-$COMMIT" dl/squashfs-root/usr/bin/lasrecomp || { echo "::error::$NAME is not nightly-$STAMP-$COMMIT inside"; exit 1; }
          # (as the linux job's check)
          tools/linux/check_no_game_code.sh dl/squashfs-root
          cp "dl/$NAME" "build/dist/LAS Recomp-$VERSION-linux-aarch64.AppImage"
          # the same round's tarball, when that nightly has one (nightlies from before the tarball don't: then the
          # release has no linux-aarch64 tarball, and says nothing of it)
          TNAME=${NAME%.AppImage}.tar.gz
          if gh release view nightly --json assets -q '.assets[].name' | grep -qx "$TNAME"; then
            gh release download nightly -p "$TNAME" -D dl
            DIGEST=$(gh api "repos/$GH_REPO/releases/tags/nightly" -q ".assets[] | select(.name == \"$TNAME\") | .digest // empty")
            [ -z "$DIGEST" ] || [ "$DIGEST" = "sha256:$(sha256sum "dl/$TNAME" | cut -d' ' -f1)" ] || { echo "::error::$TNAME: not the sha256 GitHub has"; exit 1; }
            mkdir dl/tar && tar -xzf "dl/$TNAME" -C dl/tar
            grep -aq "nightly-$STAMP-$COMMIT" "dl/tar/LAS Recomp/usr/bin/lasrecomp" || { echo "::error::$TNAME is not nightly-$STAMP-$COMMIT inside"; exit 1; }
            tools/linux/check_no_game_code.sh "dl/tar/LAS Recomp"
            cp "dl/$TNAME" "build/dist/LAS Recomp-$VERSION-linux-aarch64.tar.gz"
          else echo "::warning::no $TNAME on the nightly release: no linux-aarch64 tarball in this release"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            build/dist/*.AppImage
            build/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # (a release published on GitHub: a line on top of its notes while the files build)
  # the Android app as a release build: this release's LARECOMP_VERSION, no
  # experimental stamp (its update check takes the normal releases), signed with the published APKs' key (the
  # repository's secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD: it installs over an experimental build)
  android:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;3.30.4" "platforms;android-36" > /dev/null
      - name: Dependencies cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: android/deps/out
          key: android-deps-${{ hashFiles('android/deps/build_deps.sh', 'android/deps/build_gen_deps.sh', 'android/gen/**') }}
      - name: Dependencies (SDL3, shaderc, volk, Vulkan headers; the game code builder)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          bash android/deps/build_deps.sh
          bash android/deps/build_gen_deps.sh
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: android/deps/out
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          LARECOMP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LARECOMP_VERSION_NAME: ${{ needs.check.outputs.version }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$LARECOMP_KEYSTORE_PASSWORD" ] || { echo "::error::the signing key secrets are not set"; exit 1; }
          export LARECOMP_KEYSTORE=$RUNNER_TEMP/lasrecomp.keystore
          echo "$KEYSTORE_B64" | base64 -d > "$LARECOMP_KEYSTORE"
          # (Android's version code only grows: minutes since 2026-01-01)
          export LARECOMP_VERSION_CODE=$(( ($(date -u +%s) - $(date -u -d 20260101 +%s)) / 60 ))
          (cd android && ./gradlew assembleRelease --console=plain)
          rm -f "$LARECOMP_KEYSTORE"
      - name: Signed, and no game files
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          tools/check_apk.sh "$APK"
          mkdir -p build/dist && cp "$APK" "build/dist/LAS Recomp-$VERSION-android.apk" && ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/dist/*.apk
          if-no-files-found: error
          compression-level: 0

  announce:
    needs: check
    if: github.event_name == 'release' && needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Building line
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json body -q .body > notes.md
          { echo "> The download files are being built and will appear here in a few minutes."; echo; cat notes.md; } > new.md
          gh release edit "$TAG" --notes-file new.md

  release:
    needs: [check, macos, windows, windows-arm64, linux, linux-aarch64-nightly, android, ios]
    # (windows-arm64 is skipped unless a test build names it: a skipped job doesn't hold the draft back, a failed one does)
    if: always() && needs.check.result == 'success' && needs.check.outputs.skip != 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # (only here: the draft release)
    steps:
      - uses: actions/checkout@v4  # (tools/sparkle_notes.sh)
        with:
          ref: ${{ needs.check.outputs.sha }}
          sparse-checkout: tools
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ needs.check.outputs.sha }}
          PLATFORMS: ${{ needs.check.outputs.platforms }}
          ARM64: ${{ needs.check.outputs.arm64 }}
          NIGHTLY_ARM: ${{ needs.linux-aarch64-nightly.outputs.name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          mkdir ../manifests && mv update-*.txt appcast-*.xml ../manifests/ 2>/dev/null || true  # (the updaters', beside the files)
          ls -la . ../manifests
          # (+ the linux-x86_64 tarball; the linux-aarch64 one only when its nightly had it)
          N=7; [ "$ARM64" = true ] && N=8
          [ "$(ls | grep -v -- '-linux-aarch64\.tar\.gz$' | wc -l)" = $N ] || { echo "::error::expected $N files"; exit 1; }
          # (a test build: only the platforms its fix targets ship; the others were built as a compile check)
          for f in *; do
            case $f in *-macOS.dmg) p=macos ;; *-windows-x64.zip) p=windows ;; *-linux-x86_64.AppImage) p=linux ;;
                        *-linux-aarch64.AppImage) p=linux-aarch64 ;; *-iOS.laskit) p=ios ;; *-android.apk) p=android ;;
                        *-linux-x86_64.tar.gz) p=linux ;; *-linux-aarch64.tar.gz) p=linux-aarch64 ;;
                        *-windows-arm64.zip) p=windows-arm64 ;;
                        *) echo "::error::unknown file $f"; exit 1 ;; esac
            [[ " $PLATFORMS " == *" $p "* ]] || { echo "built, not shipped: $f"; rm "$f"; }
          done
          for m in ../manifests/*; do  # (a manifest or feed goes up only with its platform's file)
            [ -f "$m" ] || continue
            plat=$(basename "$m"); plat=${plat#update-}; plat=${plat#appcast-}; plat=${plat%.*}
            f=$plat; [ "$plat" = windows ] && f=windows-x64  # (update-windows.txt: the x64 zip)
            ls ./*-"$f".zip ./*-"$plat".AppImage ./*-"$plat".dmg >/dev/null 2>&1 || rm "$m"
          done
          MANIFESTS=(); for m in ../manifests/*; do [ -f "$m" ] && MANIFESTS+=("$m"); done
          if [ "$EVENT" = release ]; then  # (published on GitHub: attach the files, the notes get the sha256 table)
            gh release view "$TAG" --json body -q .body | grep -v '^> The download files are being built' > ../body.md || true
            { cat ../body.md; echo; [ -z "$NIGHTLY_ARM" ] || { echo "The linux-aarch64 file is the nightly build \`$NIGHTLY_ARM\`."; echo; }
              echo "| File | sha256 |"; echo "|---|---|"
              for f in *; do echo "| \`${f// /.}\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done; } > ../notes.md
            # (the macOS feed goes up with the notes already in: Sparkle's window shows them. Never fatal: on a
            #  failure the feed is left as it was, with the release page link, and the files still go up)
            if [ -f ../manifests/appcast-macOS.xml ] && ! ../tools/sparkle_notes.sh ../manifests/appcast-macOS.xml release ../body.md; then
              echo "::warning::release notes not added to appcast-macOS.xml: it keeps the release page link"
            fi
            gh release upload "$TAG" --clobber * "${MANIFESTS[@]}"
            gh release edit "$TAG" --notes-file ../notes.md
            gh release view "$TAG" --json url,assets -q '.url, (.assets[] | "\(.name) \(.size)")'
            exit 0
          fi
          # (GitHub stores asset names with dots for spaces: LAS.Recomp-<version>-...)
          {
            echo "Release notes: (to be written)"
            echo
            echo "Built from $SHA."
            echo
            [ -z "$NIGHTLY_ARM" ] || { echo "The linux-aarch64 file is the nightly build \`$NIGHTLY_ARM\`."; echo; }
            echo "| File | sha256 |"
            echo "|---|---|"
            for f in *; do echo "| \`${f// /.}\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
          } > ../notes.md
          cat ../notes.md
          PRE=(); [[ $TAG == test-* || $TAG == ci-test-* ]] && PRE=(--prerelease)
          # an existing release is only ever updated while it's still a draft
          if DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            [ "$DRAFT" = true ] || { echo "::error::release $TAG is already published: not touched"; exit 1; }
            gh release edit "$TAG" --draft --target "$SHA" --notes-file ../notes.md "${PRE[@]}"
            gh release upload "$TAG" --clobber * "${MANIFESTS[@]}"
          else
            gh release create "$TAG" --draft --target "$SHA" --title "$TAG" --notes-file ../notes.md "${PRE[@]}" * "${MANIFESTS[@]}"
          fi
          gh release view "$TAG" --json url,isDraft,assets -q '.url, .isDraft, (.assets[] | "\(.name) \(.size)")'

  # (a release published on GitHub whose build failed: the "being built" line says so instead)
  failed:
    needs: [check, macos, windows, windows-arm64, linux, linux-aarch64-nightly, android, ios, release]
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Building line
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json body -q .body | sed 's/^> The download files are being built and will appear here in a few minutes\./> The download files will be added here shortly./' > notes.md
          gh release edit "$TAG" --notes-file notes.md
