<!-- The iOS app icon: icon.svg's art edge to edge (iOS rounds the corners and pads itself), no border, opaque.
     icon_ios_1024.png is this rendered by WebKit: qlmanage -t -s 1024 -o . icon_ios.svg, then
     magick icon_ios.svg.png -alpha off -strip PNG24:icon_ios_1024.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="0.55" stop-color="#1d4f7a"/>
      <stop offset="1" stop-color="#2e8c9c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6f8f"/>
      <stop offset="1" stop-color="#0c2f4f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d79a"/>
      <stop offset="1" stop-color="#c99a52"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f3ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9cbe0"/>
      <stop offset="1" stop-color="#8fa6c2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c8891e"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#fff8e0">
      <circle cx="210" cy="215" r="5"/><circle cx="300" cy="170" r="3.5"/><circle cx="395" cy="250" r="4"/>
      <circle cx="250" cy="330" r="3"/><circle cx="470" cy="165" r="3"/><circle cx="820" cy="380" r="3.5"/>
      <circle cx="560" cy="300" r="2.8"/>
    </g>
    <!-- moon -->
    <circle cx="700" cy="275" r="200" fill="url(#moonglow)"/>
    <circle cx="700" cy="275" r="92" fill="#fff3cf"/>
    <circle cx="732" cy="252" r="82" fill="#25507c" opacity="0.18"/>
    <!-- sea -->
    <rect x="100" y="600" width="824" height="324" fill="url(#sea)"/>
    <path d="M100 640 Q180 620 260 640 T420 640 T580 640 T740 640 T924 640" stroke="#7fd3e0" stroke-width="7" fill="none" opacity="0.7"/>
    <path d="M100 705 Q200 685 300 705 T500 705 T700 705 T924 705" stroke="#5fb8cf" stroke-width="6" fill="none" opacity="0.55"/>
    <!-- island -->
    <path d="M150 640 Q330 520 560 600 Q700 610 770 640 Z" fill="#14363f"/>
    <path d="M300 585 Q360 470 430 560 Q470 520 520 590 Z" fill="#1b4a52"/>
    <!-- palm -->
    <path d="M395 600 Q385 520 420 440" stroke="#0e2a31" stroke-width="16" fill="none" stroke-linecap="round"/>
    <g fill="#0e2a31">
      <path d="M420 440 Q360 410 320 440 Q365 420 420 446 Z"/>
      <path d="M420 440 Q470 395 525 418 Q470 410 422 447 Z"/>
      <path d="M420 440 Q400 380 350 375 Q395 395 416 446 Z"/>
      <path d="M420 440 Q455 455 480 500 Q445 465 418 447 Z"/>
    </g>
    <!-- sword in the sand -->
    <g transform="translate(600 360) rotate(7)">
      <path d="M-22 120 L22 120 L22 470 L0 520 L-22 470 Z" fill="url(#blade)" stroke="#5c728e" stroke-width="4"/>
      <rect x="-80" y="96" width="160" height="30" rx="12" fill="url(#gold)" stroke="#7a4d10" stroke-width="4"/>
      <rect x="-15" y="0" width="30" height="100" rx="8" fill="#3b5fa8" stroke="#1d335f" stroke-width="4"/>
      <circle cx="0" cy="-10" r="24" fill="url(#gold)" stroke="#7a4d10" stroke-width="4"/>
      <path d="M-30 128 L0 150 L30 128" fill="#c8891e"/>
    </g>
    <!-- beach foreground -->
    <path d="M100 924 L100 820 Q330 750 560 790 Q760 820 924 770 L924 924 Z" fill="url(#sand)"/>
    <path d="M520 812 Q640 770 760 808" fill="#e6c27d"/>
    <path d="M540 868 Q640 842 750 870" stroke="#b5864a" stroke-width="10" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>
